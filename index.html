<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Ancient Realm</title><link rel="stylesheet" href="style.css"></head><body>
<div id="menu">
 <div class="mbox"><h1>ANCIENT<br><span>REALM</span></h1><p class="by">A solo card game by Steven Aramini · Art by Startraphell Talbot</p>
  <h3>Expansions</h3><div id="exp"></div>
  <button id="start" class="primary">Start Game</button><button id="rulesBtn" class="ghost">Read the Rules</button>
  <p class="fine">Fan-made digital adaptation of the print-and-play edition. Not affiliated with the designer or publisher.</p></div>
</div>
<div id="game" hidden>
 <header id="hud">
  <div id="scorebox" title="Score breakdown"><div id="score"></div><div id="turn"></div></div>
  <div class="btns">
      <button id="bMenu" class="ib" title="Menu" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  </div></header>
 <div id="objs"></div><div id="hint"></div><div id="realm"></div><div id="market"></div><div id="store"></div><div id="actbar"><button id="bUndoT" class="ib" title="Reset turn" aria-label="Reset turn"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5M12 7v5l3 2"/></svg><span>Reset turn</span></button>
   <button id="bOk" class="ib ok" title="Confirm move" aria-label="Confirm move"><svg viewBox="0 0 24 24"><path d="M4 13l5 5L20 6"/></svg><span>Confirm</span></button></div><button id="fit" hidden title="Fit realm to screen" aria-label="Fit realm">⤢</button>
</div>
<div id="modal" hidden></div><div id="zoom" hidden></div><div id="rules" hidden></div><div id="rb" hidden></div><div id="toast"></div>
<script src="data.js"></script><script src="game.js"></script></body></html>
